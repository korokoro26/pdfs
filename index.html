<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF共有ポータル</title>
  
  <!-- 1. Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            apple: {
              bg: '#F5F5F7',
              card: '#FFFFFF',
              primary: '#0071E3',
              primaryHover: '#0077ED',
              danger: '#FF3B30',
              dangerHover: '#D73A31',
              text: '#1D1D1F',
              secondaryText: '#86868B',
              border: '#E5E5EA',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- 2. Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 3. Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 4. PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    .backdrop-blur-md {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .unselectable {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-apple-bg text-apple-text font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-apple-primary selection:text-white">

  <!-- ヘッダーエリア -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-apple-border/60">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-apple-primary/10 text-apple-primary rounded-xl">
            <i data-lucide="file-text" class="w-6 h-6"></i>
          </div>
          <h1 class="text-xl font-semibold tracking-tight text-apple-text hidden sm:block">PDF共有ポータル</h1>
        </div>

        <!-- 2ページ切り替えタブ -->
        <nav class="flex bg-gray-100 p-1 rounded-xl space-x-1">
          <button id="tabLibraryBtn" onclick="switchPage('library')" class="px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-200 bg-white text-apple-text shadow-sm">
            PDFライブラリ
          </button>
          <button id="tabUploadBtn" onclick="switchPage('upload')" class="px-4 py-1.5 text-xs font-medium rounded-lg transition-all duration-200 text-apple-secondaryText hover:text-apple-text">
            PDFアップロード
          </button>
        </nav>
      </div>

      <!-- ステータスバッジ -->
      <div id="statusBadge" class="flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium bg-gray-100 text-apple-secondaryText transition-all duration-300">
        <span class="w-2 h-2 rounded-full bg-gray-400 animate-pulse" id="statusDot"></span>
        <span id="statusText" class="hidden sm:inline">システム初期化中...</span>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl mx-auto px-6 py-8 w-full flex-grow space-y-8">

    <!-- ページ 1: PDFライブラリ (初期画面) -->
    <section id="pageLibrary" class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl font-semibold text-apple-text flex items-center gap-2">
            <i data-lucide="layout-grid" class="w-5 h-5 text-apple-primary"></i>
            共有ドキュメント ライブラリ
          </h2>
          <p class="text-xs text-apple-secondaryText mt-0.5">サムネイルをタップして閲覧できます</p>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <!-- 検索バー -->
          <div class="relative flex-grow sm:w-64">
            <input type="text" id="searchInput" placeholder="タイトル・PDF本文を検索..." class="w-full pl-9 pr-8 py-2 text-sm bg-white border border-apple-border/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-apple-primary/20 focus:border-apple-primary transition-all shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-apple-secondaryText">
              <i data-lucide="search" class="w-4 h-4"></i>
            </div>
            <button id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-gray-400 hover:text-gray-600 hidden">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <button id="refreshBtn" class="p-2 text-apple-secondaryText hover:text-apple-text bg-white rounded-xl border border-apple-border/80 transition-all shadow-sm shrink-0" title="更新">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div id="searchSearchingNotice" class="hidden text-xs text-apple-primary flex items-center gap-1.5 px-1">
        <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i>
        <span>PDF内部テキストを解析中...</span>
      </div>

      <!-- PDFカードグリッド -->
      <div id="pdfGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- カードが動的に追加されます -->
      </div>
    </section>

    <!-- ページ 2: PDFアップロード -->
    <section id="pageUpload" class="hidden bg-apple-card rounded-2xl p-6 shadow-sm border border-apple-border/80 transition-all duration-300 max-w-2xl mx-auto">
      <h2 class="text-lg font-semibold text-apple-text mb-4 flex items-center gap-2">
        <i data-lucide="upload-cloud" class="w-5 h-5 text-apple-primary"></i>
        新しいPDFをアップロード
      </h2>

      <!-- ドロップエリア -->
      <div id="dropZone" class="border-2 border-dashed border-apple-border rounded-xl p-6 text-center bg-gray-50/50 hover:bg-gray-50 hover:border-apple-primary/50 transition-all cursor-pointer group">
        <input type="file" id="pdfFile" accept="application/pdf" class="hidden">
        
        <div class="flex flex-col items-center justify-center space-y-3">
          <div class="p-3 bg-white rounded-full shadow-sm border border-apple-border group-hover:scale-105 transition-transform">
            <i data-lucide="file-up" class="w-7 h-7 text-apple-primary"></i>
          </div>
          <div>
            <p class="text-sm font-medium text-apple-text">
              クリックしてファイルを選択 <span class="text-apple-secondaryText font-normal">またはドラッグ＆ドロップ</span>
            </p>
            <p class="text-xs text-apple-secondaryText mt-1">PDF形式のみ対応</p>
          </div>
          <div id="selectedFileName" class="text-xs font-medium text-apple-primary bg-apple-primary/10 px-3 py-1 rounded-full hidden">
            <!-- 選択ファイル名 -->
          </div>
        </div>
      </div>

      <!-- 入力フォームエリア -->
      <div id="formFieldsContainer" class="mt-4 hidden space-y-3">
        <div>
          <label for="customTitle" class="block text-xs font-medium text-apple-secondaryText mb-1">
            表示用タイトル（任意）
          </label>
          <input type="text" id="customTitle" placeholder="未入力の場合は元のファイル名が使われます" class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-apple-border rounded-xl focus:outline-none focus:ring-2 focus:ring-apple-primary/20 focus:border-apple-primary transition-all">
        </div>

        <div>
          <label for="filePassword" class="block text-xs font-medium text-apple-secondaryText mb-1">
            閲覧保護パスワード（任意）
          </label>
          <input type="password" id="filePassword" placeholder="設定すると閲覧時にパスワードが必要になります" class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-apple-border rounded-xl focus:outline-none focus:ring-2 focus:ring-apple-primary/20 focus:border-apple-primary transition-all">
        </div>
      </div>

      <!-- 送信ボタン -->
      <div class="mt-4 flex justify-end">
        <button id="uploadBtn" disabled class="px-6 py-2.5 bg-apple-primary hover:bg-apple-primaryHover disabled:opacity-40 disabled:hover:bg-apple-primary text-white text-sm font-medium rounded-xl shadow-sm transition-all duration-200 flex items-center space-x-2 cursor-pointer disabled:cursor-not-allowed">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>送信する</span>
        </button>
      </div>
    </section>

  </main>

  <!-- フッター -->
  <footer class="max-w-6xl mx-auto px-6 py-6 w-full text-center text-xs text-apple-secondaryText flex justify-between items-center border-t border-apple-border/40">
    <p>&copy; PDF Portal System</p>
    <span class="opacity-40 text-[10px] font-mono">v2.5.0</span>
  </footer>

  <!-- ファイル名編集ダイアログモーダル -->
  <div id="editTitleModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl border border-apple-border transform scale-95 transition-transform duration-200" id="editTitleModalCard">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 bg-blue-50 text-apple-primary rounded-full flex items-center justify-center mx-auto">
          <i data-lucide="edit-3" class="w-6 h-6"></i>
        </div>
        <h3 class="text-base font-semibold text-apple-text">ファイル名の編集</h3>
      </div>

      <div class="mt-4 space-y-1 text-left">
        <input type="text" id="editTitleInput" placeholder="新しいファイル名を入力" class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-apple-border rounded-xl focus:outline-none focus:ring-2 focus:ring-apple-primary/20 focus:border-apple-primary transition-all">
      </div>

      <div class="mt-6 flex space-x-3">
        <button id="cancelEditTitleBtn" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-apple-text text-xs font-medium rounded-xl transition-colors">
          キャンセル
        </button>
        <button id="confirmEditTitleBtn" class="flex-1 py-2 bg-apple-primary hover:bg-apple-primaryHover text-white text-xs font-medium rounded-xl transition-colors">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- PDF閲覧用パスワード認証モーダル -->
  <div id="pdfAuthModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl border border-apple-border transform scale-95 transition-transform duration-200" id="pdfAuthModalCard">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 bg-blue-50 text-apple-primary rounded-full flex items-center justify-center mx-auto">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h3 class="text-base font-semibold text-apple-text">パスワードで保護されたファイル</h3>
        <p class="text-xs text-apple-secondaryText">閲覧するには保護パスワードを入力してください。</p>
      </div>

      <div class="mt-4 space-y-1 text-left">
        <input type="password" id="pdfPasswordInput" placeholder="パスワードを入力" class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-apple-border rounded-xl focus:outline-none focus:ring-2 focus:ring-apple-primary/20 focus:border-apple-primary transition-all">
        <p id="pdfPasswordErrorMsg" class="text-[11px] text-apple-danger mt-1 hidden">パスワードが正しくありません</p>
      </div>

      <div class="mt-6 flex space-x-3">
        <button id="cancelPdfAuthBtn" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-apple-text text-xs font-medium rounded-xl transition-colors">
          キャンセル
        </button>
        <button id="confirmPdfAuthBtn" class="flex-1 py-2 bg-apple-primary hover:bg-apple-primaryHover text-white text-xs font-medium rounded-xl transition-colors">
          閲覧する
        </button>
      </div>
    </div>
  </div>

  <!-- 透かし消去用パスワード認証モーダル -->
  <div id="watermarkAuthModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl border border-apple-border transform scale-95 transition-transform duration-200" id="watermarkAuthModalCard">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto">
          <i data-lucide="shield-off" class="w-6 h-6"></i>
        </div>
        <h3 class="text-base font-semibold text-apple-text">透かし消去キーの入力</h3>
        <p class="text-xs text-apple-secondaryText">透かしを削除するには管理用パスワードを入力してください。</p>
      </div>

      <div class="mt-4 space-y-1 text-left">
        <input type="password" id="watermarkPasswordInput" placeholder="パスワードを入力" class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-apple-border rounded-xl focus:outline-none focus:ring-2 focus:ring-apple-primary/20 focus:border-apple-primary transition-all">
        <p id="watermarkPasswordErrorMsg" class="text-[11px] text-apple-danger mt-1 hidden">パスワードが正しくありません</p>
      </div>

      <div class="mt-6 flex space-x-3">
        <button id="cancelWatermarkAuthBtn" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-apple-text text-xs font-medium rounded-xl transition-colors">
          キャンセル
        </button>
        <button id="confirmWatermarkAuthBtn" class="flex-1 py-2 bg-apple-primary hover:bg-apple-primaryHover text-white text-xs font-medium rounded-xl transition-colors">
          実行
        </button>
      </div>
    </div>
  </div>

  <!-- PDFインラインビューアモーダル -->
  <div id="pdfViewerModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex flex-col hidden opacity-0 transition-opacity duration-200 unselectable">
    <!-- ビューアヘッダー -->
    <div class="bg-white/10 backdrop-blur-md px-6 py-3 flex items-center justify-between text-white border-b border-white/10">
      <div class="flex items-center space-x-3 overflow-hidden">
        <i data-lucide="file-text" class="w-5 h-5 text-apple-primary shrink-0"></i>
        <span id="viewerTitle" class="text-sm font-medium truncate">PDF プレビュー</span>
      </div>
      <div class="flex items-center space-x-3 shrink-0">
        <!-- 透かし除去ボタン -->
        <button id="removeWatermarkBtn" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-lg text-xs font-medium text-white transition-all flex items-center gap-1.5">
          <i data-lucide="eye" class="w-3.5 h-3.5"></i>
          <span>透かし消去</span>
        </button>
        <button id="closeViewerBtn" class="p-2 bg-white/10 hover:bg-white/20 rounded-full transition-colors text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    <!-- ビューア本体（キャンバスレンダリングエリア） -->
    <div id="pdfCanvasContainer" class="flex-grow overflow-y-auto p-4 sm:p-8 flex flex-col items-center space-y-6">
      <!-- jsでCanvas要素が順次追加されます -->
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const SUPABASE_URL = 'https://wgjhqhcrepyhqcxrxujg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__5xWbo2yzkPwOyecIN_gOQ_6VE83HNT';
    const WATERMARK_REMOVE_PASS = '1193'; // 透かし消去用共通パスワード

    const CURRENT_USER_ID = 'USER_' + Math.floor(1000 + Math.random() * 9000);

    let supabaseClient = null;
    let allPdfsCache = [];
    let generatedThumbnailCanvas = null;
    let searchDebounceTimer = null;

    // 現在操作・閲覧中の対象情報
    let targetPdfForAuth = null;
    let targetPdfForEdit = null;
    let currentViewingPdf = {
      url: null,
      title: '',
      isWatermarkDisabled: false
    };

    const statusBadge = document.getElementById('statusBadge');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('pdfFile');
    const customTitleInput = document.getElementById('customTitle');
    const filePasswordInput = document.getElementById('filePassword');
    const formFieldsContainer = document.getElementById('formFieldsContainer');
    const selectedFileName = document.getElementById('selectedFileName');
    const uploadBtn = document.getElementById('uploadBtn');
    const pdfGrid = document.getElementById('pdfGrid');
    const refreshBtn = document.getElementById('refreshBtn');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const searchSearchingNotice = document.getElementById('searchSearchingNotice');

    // タブ要素
    const pageLibrary = document.getElementById('pageLibrary');
    const pageUpload = document.getElementById('pageUpload');
    const tabLibraryBtn = document.getElementById('tabLibraryBtn');
    const tabUploadBtn = document.getElementById('tabUploadBtn');

    // タイトル編集モーダル要素
    const editTitleModal = document.getElementById('editTitleModal');
    const editTitleModalCard = document.getElementById('editTitleModalCard');
    const editTitleInput = document.getElementById('editTitleInput');
    const cancelEditTitleBtn = document.getElementById('cancelEditTitleBtn');
    const confirmEditTitleBtn = document.getElementById('confirmEditTitleBtn');

    // PDF閲覧保護認証モーダル要素
    const pdfAuthModal = document.getElementById('pdfAuthModal');
    const pdfAuthModalCard = document.getElementById('pdfAuthModalCard');
    const pdfPasswordInput = document.getElementById('pdfPasswordInput');
    const pdfPasswordErrorMsg = document.getElementById('pdfPasswordErrorMsg');
    const cancelPdfAuthBtn = document.getElementById('cancelPdfAuthBtn');
    const confirmPdfAuthBtn = document.getElementById('confirmPdfAuthBtn');

    // 透かし解除認証モーダル要素
    const watermarkAuthModal = document.getElementById('watermarkAuthModal');
    const watermarkAuthModalCard = document.getElementById('watermarkAuthModalCard');
    const watermarkPasswordInput = document.getElementById('watermarkPasswordInput');
    const watermarkPasswordErrorMsg = document.getElementById('watermarkPasswordErrorMsg');
    const cancelWatermarkAuthBtn = document.getElementById('cancelWatermarkAuthBtn');
    const confirmWatermarkAuthBtn = document.getElementById('confirmWatermarkAuthBtn');

    // Viewモーダル要素
    const pdfViewerModal = document.getElementById('pdfViewerModal');
    const pdfCanvasContainer = document.getElementById('pdfCanvasContainer');
    const viewerTitle = document.getElementById('viewerTitle');
    const removeWatermarkBtn = document.getElementById('removeWatermarkBtn');
    const closeViewerBtn = document.getElementById('closeViewerBtn');

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initSupabase();
      setupEventListeners();
    });

    function initSupabase() {
      try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        updateStatus('success', 'Supabase接続完了');
        loadPdfs();
      } catch (e) {
        updateStatus('error', `初期化エラー: ${e.message}`);
      }
    }

    function switchPage(page) {
      if (page === 'library') {
        pageLibrary.classList.remove('hidden');
        pageUpload.classList.add('hidden');
        
        tabLibraryBtn.className = 'px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-200 bg-white text-apple-text shadow-sm';
        tabUploadBtn.className = 'px-4 py-1.5 text-xs font-medium rounded-lg transition-all duration-200 text-apple-secondaryText hover:text-apple-text';
      } else {
        pageLibrary.classList.add('hidden');
        pageUpload.classList.remove('hidden');

        tabUploadBtn.className = 'px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-200 bg-white text-apple-text shadow-sm';
        tabLibraryBtn.className = 'px-4 py-1.5 text-xs font-medium rounded-lg transition-all duration-200 text-apple-secondaryText hover:text-apple-text';
      }
    }

    function updateStatus(type, message) {
      statusText.innerText = message;
      if (type === 'loading') {
        statusBadge.className = 'flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium bg-blue-50 text-blue-600';
        statusDot.className = 'w-2 h-2 rounded-full bg-blue-500 animate-pulse';
      } else if (type === 'success') {
        statusBadge.className = 'flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-600';
        statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
      } else if (type === 'error') {
        statusBadge.className = 'flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium bg-rose-50 text-rose-600';
        statusDot.className = 'w-2 h-2 rounded-full bg-rose-500';
      }
    }

    function setupEventListeners() {
      dropZone.addEventListener('click', () => fileInput.click());

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-apple-primary', 'bg-blue-50/30');
      });

      ['dragleave', 'dragend'].forEach(type => {
        dropZone.addEventListener(type, () => {
          dropZone.classList.remove('border-apple-primary', 'bg-blue-50/30');
        });
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-apple-primary', 'bg-blue-50/30');
        if (e.dataTransfer.files.length > 0) {
          fileInput.files = e.dataTransfer.files;
          handleFileSelect();
        }
      });

      fileInput.addEventListener('change', handleFileSelect);
      uploadBtn.addEventListener('click', handleUpload);
      refreshBtn.addEventListener('click', loadPdfs);

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim();
        clearSearchBtn.classList.toggle('hidden', query === '');
        
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
          filterAndRenderPdfs(query);
        }, 300);
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        filterAndRenderPdfs('');
      });

      // タイトル編集モーダルイベント
      cancelEditTitleBtn.addEventListener('click', closeEditTitleModal);
      confirmEditTitleBtn.addEventListener('click', saveEditedTitle);
      editTitleInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') saveEditedTitle();
      });

      // PDF保護パスワードモーダルイベント
      cancelPdfAuthBtn.addEventListener('click', closePdfAuthModal);
      confirmPdfAuthBtn.addEventListener('click', verifyPdfPassword);
      pdfPasswordInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') verifyPdfPassword();
      });

      // 透かし消去モーダルイベント
      removeWatermarkBtn.addEventListener('click', openWatermarkAuthModal);
      cancelWatermarkAuthBtn.addEventListener('click', closeWatermarkAuthModal);
      confirmWatermarkAuthBtn.addEventListener('click', verifyWatermarkPassword);
      watermarkPasswordInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') verifyWatermarkPassword();
      });

      closeViewerBtn.addEventListener('click', closePdfViewerModal);
      pdfViewerModal.addEventListener('contextmenu', e => e.preventDefault());
    }

    async function handleFileSelect() {
      const file = fileInput.files[0];
      if (!file) return;

      if (file.type !== 'application/pdf') {
        alert('PDF形式のファイルのみアップロード可能です。');
        fileInput.value = '';
        selectedFileName.classList.add('hidden');
        formFieldsContainer.classList.add('hidden');
        uploadBtn.disabled = true;
        return;
      }

      selectedFileName.innerText = `${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
      selectedFileName.classList.remove('hidden');
      formFieldsContainer.classList.remove('hidden');
      customTitleInput.value = '';
      filePasswordInput.value = '';
      uploadBtn.disabled = false;

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const page = await pdf.getPage(1);
        
        const viewport = page.getViewport({ scale: 0.5 });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;
        generatedThumbnailCanvas = canvas;
      } catch (err) {
        console.warn('サムネイル生成に失敗しました:', err);
        generatedThumbnailCanvas = null;
      }
    }

    async function loadPdfs() {
      if (!supabaseClient) return;
      updateStatus('loading', 'ライブラリを取得中...');

      const { data, error } = await supabaseClient
        .from('pdf_list')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        updateStatus('error', `取得失敗: ${error.message}`);
        return;
      }

      updateStatus('success', '正常に同期中');
      allPdfsCache = data || [];
      filterAndRenderPdfs(searchInput.value.trim());
    }

    async function filterAndRenderPdfs(query) {
      if (!query) {
        searchSearchingNotice.classList.add('hidden');
        renderPdfGrid(allPdfsCache);
        return;
      }

      const lowerQuery = query.toLowerCase();
      searchSearchingNotice.classList.remove('hidden');

      let matchedPdfs = allPdfsCache.filter(item => 
        item.file_name.toLowerCase().includes(lowerQuery)
      );

      const unmathcedPdfs = allPdfsCache.filter(item => 
        !item.file_name.toLowerCase().includes(lowerQuery)
      );

      for (const item of unmathcedPdfs) {
        const hasText = await searchPdfContent(item.file_url, lowerQuery);
        if (hasText) {
          matchedPdfs.push(item);
        }
      }

      searchSearchingNotice.classList.add('hidden');
      renderPdfGrid(matchedPdfs);
    }

    async function searchPdfContent(pdfUrl, keyword) {
      try {
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
        const maxPages = Math.min(pdf.numPages, 15);

        for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ').toLowerCase();

          if (pageText.includes(keyword)) {
            return true;
          }
        }
      } catch (err) {
        console.warn('PDF本文読み込みエラー:', pdfUrl, err);
      }
      return false;
    }

    function renderPdfGrid(items) {
      pdfGrid.innerHTML = '';

      if (!items || items.length === 0) {
        pdfGrid.className = "col-span-full";
        pdfGrid.innerHTML = `
          <div class="p-12 text-center text-apple-secondaryText text-sm border border-dashed border-apple-border rounded-2xl bg-white/50">
            <i data-lucide="file-x" class="w-10 h-10 mx-auto mb-2 text-gray-300"></i>
            条件に一致するPDFは見つかりませんでした。
          </div>`;
        return;
      }

      pdfGrid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6";

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'group bg-white rounded-2xl border border-apple-border/80 shadow-sm hover:shadow-md hover:border-apple-primary/40 transition-all duration-300 flex flex-col overflow-hidden relative';

        const dateStr = new Date(item.created_at).toLocaleString('ja-JP', {
          year: 'numeric', month: '2-digit', day: '2-digit'
        });

        const storagePath = extractStoragePath(item.file_url);
        const thumbnailSrc = item.thumbnail_url || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="%2386868B" stroke-width="1"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>';

        const isProtected = item.password && item.password.trim() !== '';

        card.innerHTML = `
          <div class="open-pdf-btn block aspect-[4/3] bg-gray-100 overflow-hidden relative group/img cursor-pointer" 
               data-id="${item.id}" 
               data-url="${item.file_url}" 
               data-name="${escapeHtml(item.file_name)}"
               data-pass="${escapeHtml(item.password || '')}">
            <img src="${thumbnailSrc}" alt="${escapeHtml(item.file_name)}" class="w-full h-full object-cover object-top group-hover/img:scale-105 transition-transform duration-300">

            ${isProtected ? `
              <div class="absolute top-2 left-2 px-2 py-1 bg-black/60 backdrop-blur-md rounded-lg text-white text-[10px] font-medium flex items-center gap-1 z-10">
                <i data-lucide="lock" class="w-3 h-3 text-amber-400"></i>
                <span>保護あり</span>
              </div>
            ` : ''}

            <div class="absolute inset-0 bg-black/0 group-hover/img:bg-black/10 transition-colors flex items-center justify-center">
              <span class="opacity-0 group-hover/img:opacity-100 transition-opacity bg-white/90 backdrop-blur-sm text-apple-text text-xs font-semibold px-3.5 py-1.5 rounded-full shadow-md flex items-center gap-1.5">
                <i data-lucide="${isProtected ? 'lock' : 'book-open'}" class="w-3.5 h-3.5 text-apple-primary"></i> ${isProtected ? '解除して開く' : '開く'}
              </span>
            </div>

            <div class="absolute top-2 right-2 flex items-center gap-1.5 z-10">
              <button class="edit-btn p-1.5 bg-white/80 hover:bg-white text-apple-secondaryText hover:text-apple-primary rounded-xl backdrop-blur-md shadow-sm transition-all" 
                      title="名前を編集" 
                      data-id="${item.id}" 
                      data-name="${escapeHtml(item.file_name)}">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
              </button>
              <button class="delete-btn p-1.5 bg-white/80 hover:bg-white text-apple-secondaryText hover:text-apple-danger rounded-xl backdrop-blur-md shadow-sm transition-all" 
                      title="削除" 
                      data-id="${item.id}" 
                      data-path="${storagePath}">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <div class="p-3.5 flex flex-col flex-grow justify-between">
            <h3 class="open-pdf-btn font-medium text-xs sm:text-sm text-apple-text hover:text-apple-primary line-clamp-3 transition-colors leading-snug cursor-pointer" 
                data-id="${item.id}" 
                data-url="${item.file_url}" 
                data-name="${escapeHtml(item.file_name)}"
                data-pass="${escapeHtml(item.password || '')}"
                title="${escapeHtml(item.file_name)}">
              ${escapeHtml(item.file_name)}
            </h3>
            <span class="text-[10px] sm:text-[11px] text-apple-secondaryText mt-2 block">${dateStr}</span>
          </div>
        `;

        pdfGrid.appendChild(card);
      });

      lucide.createIcons();

      // カード選択時処理
      document.querySelectorAll('.open-pdf-btn').forEach(elem => {
        elem.addEventListener('click', (e) => {
          const btn = e.currentTarget;
          const url = btn.getAttribute('data-url');
          const name = btn.getAttribute('data-name');
          const pass = btn.getAttribute('data-pass');

          if (pass && pass.trim() !== '') {
            targetPdfForAuth = { url, name, pass };
            openPdfAuthModal();
          } else {
            openPdfDirectly(url, name);
          }
        });
      });

      // 編集ボタン処理
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-id');
          const currentName = btn.getAttribute('data-name');
          openEditTitleModal(id, currentName);
        });
      });

      // 削除ボタン処理
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const button = e.currentTarget;
          handleDeletePdf({
            pdfId: button.getAttribute('data-id'),
            storagePath: button.getAttribute('data-path')
          });
        });
      });
    }

    /* ★ ファイル名編集機能 */
    function openEditTitleModal(id, currentName) {
      targetPdfForEdit = { id, currentName };
      editTitleInput.value = currentName;

      editTitleModal.classList.remove('hidden');
      setTimeout(() => {
        editTitleModal.classList.remove('opacity-0');
        editTitleModalCard.classList.remove('scale-95');
        editTitleModalCard.classList.add('scale-100');
        editTitleInput.focus();
      }, 10);
    }

    function closeEditTitleModal() {
      editTitleModal.classList.add('opacity-0');
      editTitleModalCard.classList.remove('scale-100');
      editTitleModalCard.classList.add('scale-95');
      setTimeout(() => {
        editTitleModal.classList.add('hidden');
        targetPdfForEdit = null;
      }, 200);
    }

    async function saveEditedTitle() {
      if (!supabaseClient || !targetPdfForEdit) return;

      const newTitle = editTitleInput.value.trim();
      if (!newTitle) {
        alert('ファイル名を入力してください。');
        return;
      }

      if (newTitle === targetPdfForEdit.currentName) {
        closeEditTitleModal();
        return;
      }

      updateStatus('loading', 'タイトルを更新中...');

      try {
        const { error } = await supabaseClient
          .from('pdf_list')
          .update({ file_name: newTitle })
          .eq('id', targetPdfForEdit.id);

        if (error) throw error;

        updateStatus('success', 'タイトルを更新しました');
        closeEditTitleModal();
        loadPdfs();
      } catch (err) {
        updateStatus('error', `更新エラー: ${err.message}`);
      }
    }

    /* ★ PDF閲覧パスワード認証 */
    function openPdfAuthModal() {
      pdfPasswordInput.value = '';
      pdfPasswordErrorMsg.classList.add('hidden');
      pdfPasswordInput.classList.remove('border-apple-danger');

      pdfAuthModal.classList.remove('hidden');
      setTimeout(() => {
        pdfAuthModal.classList.remove('opacity-0');
        pdfAuthModalCard.classList.remove('scale-95');
        pdfAuthModalCard.classList.add('scale-100');
        pdfPasswordInput.focus();
      }, 10);
    }

    function closePdfAuthModal() {
      pdfAuthModal.classList.add('opacity-0');
      pdfAuthModalCard.classList.remove('scale-100');
      pdfAuthModalCard.classList.add('scale-95');
      setTimeout(() => {
        pdfAuthModal.classList.add('hidden');
        targetPdfForAuth = null;
      }, 200);
    }

    function verifyPdfPassword() {
      if (!targetPdfForAuth) return;

      const inputPass = pdfPasswordInput.value.trim();
      if (inputPass === targetPdfForAuth.pass) {
        const { url, name } = targetPdfForAuth;
        closePdfAuthModal();
        openPdfDirectly(url, name);
      } else {
        pdfPasswordErrorMsg.classList.remove('hidden');
        pdfPasswordInput.classList.add('border-apple-danger');
      }
    }

    function openPdfDirectly(url, name) {
      currentViewingPdf.url = url;
      currentViewingPdf.title = name;
      currentViewingPdf.isWatermarkDisabled = false;

      removeWatermarkBtn.classList.remove('hidden');
      renderPdfView();
    }

    async function handleDeletePdf(fileInfo) {
      if (!supabaseClient) return;

      if (!confirm('このファイルを削除してもよろしいですか？')) {
        return;
      }

      updateStatus('loading', 'ファイルを削除中...');

      try {
        if (fileInfo.storagePath) {
          const thumbPath = `thumb_${fileInfo.storagePath}.jpg`;
          await supabaseClient.storage.from('pdfs').remove([fileInfo.storagePath, thumbPath]);
        }

        const { error: dbError } = await supabaseClient
          .from('pdf_list')
          .delete()
          .eq('id', fileInfo.pdfId);

        if (dbError) throw dbError;

        updateStatus('success', '削除が完了しました');
        loadPdfs();

      } catch (err) {
        updateStatus('error', `削除エラー: ${err.message}`);
      }
    }

    /* ★ 透かし消去ボタン用認証モーダル制御 */
    function openWatermarkAuthModal() {
      watermarkPasswordInput.value = '';
      watermarkPasswordErrorMsg.classList.add('hidden');
      watermarkPasswordInput.classList.remove('border-apple-danger');

      watermarkAuthModal.classList.remove('hidden');
      setTimeout(() => {
        watermarkAuthModal.classList.remove('opacity-0');
        watermarkAuthModalCard.classList.remove('scale-95');
        watermarkAuthModalCard.classList.add('scale-100');
        watermarkPasswordInput.focus();
      }, 10);
    }

    function closeWatermarkAuthModal() {
      watermarkAuthModal.classList.add('opacity-0');
      watermarkAuthModalCard.classList.remove('scale-100');
      watermarkAuthModalCard.classList.add('scale-95');
      setTimeout(() => {
        watermarkAuthModal.classList.add('hidden');
      }, 200);
    }

    function verifyWatermarkPassword() {
      const inputPass = watermarkPasswordInput.value.trim();
      if (inputPass === WATERMARK_REMOVE_PASS) {
        closeWatermarkAuthModal();
        currentViewingPdf.isWatermarkDisabled = true;
        removeWatermarkBtn.classList.add('hidden');
        renderPdfView();
      } else {
        watermarkPasswordErrorMsg.classList.remove('hidden');
        watermarkPasswordInput.classList.add('border-apple-danger');
      }
    }

    /* ★ PDFレンダリング処理 */
    async function renderPdfView() {
      pdfCanvasContainer.innerHTML = `
        <div class="text-white text-center py-20 space-y-3">
          <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto text-apple-primary"></i>
          <p class="text-sm font-medium">ドキュメントをレンダリング中...</p>
        </div>`;
      lucide.createIcons();

      viewerTitle.innerText = currentViewingPdf.title;
      pdfViewerModal.classList.remove('hidden');
      setTimeout(() => pdfViewerModal.classList.remove('opacity-0'), 10);

      try {
        const loadingTask = pdfjsLib.getDocument(currentViewingPdf.url);
        const pdf = await loadingTask.promise;
        pdfCanvasContainer.innerHTML = '';

        const now = new Date();
        const dateFormatted = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const watermarkText = `${CURRENT_USER_ID} | ${dateFormatted}`;

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          
          const scale = window.innerWidth < 640 ? 1.0 : 1.5;
          const viewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.className = "shadow-2xl rounded bg-white max-w-full";

          // PDF描画
          await page.render({ canvasContext: context, viewport: viewport }).promise;

          // 透かし消去フラグが立っていない場合のみ描画
          if (!currentViewingPdf.isWatermarkDisabled) {
            drawWatermarkOnCanvas(context, canvas.width, canvas.height, watermarkText);
          }

          pdfCanvasContainer.appendChild(canvas);
        }
      } catch (err) {
        pdfCanvasContainer.innerHTML = `
          <div class="text-rose-400 text-center py-20 space-y-2">
            <i data-lucide="alert-circle" class="w-8 h-8 mx-auto"></i>
            <p class="text-sm">PDFの描画に失敗しました: ${err.message}</p>
          </div>`;
        lucide.createIcons();
      }
    }

    /* Canvas全体に斜めの透かし文字を描画 */
    function drawWatermarkOnCanvas(ctx, width, height, text) {
      ctx.save();
      
      ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const angle = -30 * Math.PI / 180;
      const stepX = 260;
      const stepY = 180;

      for (let y = -height; y < height * 2; y += stepY) {
        for (let x = -width; x < width * 2; x += stepX) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.fillText(text, 0, 0);
          ctx.restore();
        }
      }

      ctx.restore();
    }

    function closePdfViewerModal() {
      pdfViewerModal.classList.add('opacity-0');
      setTimeout(() => {
        pdfViewerModal.classList.add('hidden');
        pdfCanvasContainer.innerHTML = '';
      }, 200);
    }

    async function handleUpload() {
      if (!supabaseClient) return;

      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      updateStatus('loading', 'アップロード準備中...');

      const timestamp = Date.now();
      const safeFileName = `${timestamp}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
      
      const displayTitle = customTitleInput.value.trim() !== '' 
        ? customTitleInput.value.trim() 
        : file.name;

      const filePassword = filePasswordInput.value.trim();

      try {
        let thumbnailUrl = null;

        if (generatedThumbnailCanvas) {
          updateStatus('loading', 'サムネイルを作成中...');
          const thumbBlob = await new Promise(resolve => generatedThumbnailCanvas.toBlob(resolve, 'image/jpeg', 0.8));
          const thumbFileName = `thumb_${safeFileName}.jpg`;

          const { error: thumbStorageError } = await supabaseClient.storage
            .from('pdfs')
            .upload(thumbFileName, thumbBlob, { contentType: 'image/jpeg' });

          if (!thumbStorageError) {
            const { data: thumbUrlData } = supabaseClient.storage
              .from('pdfs')
              .getPublicUrl(thumbFileName);
            thumbnailUrl = thumbUrlData.publicUrl;
          }
        }

        updateStatus('loading', 'PDF本体をアップロード中...');
        const { error: storageError } = await supabaseClient.storage
          .from('pdfs')
          .upload(safeFileName, file);

        if (storageError) throw storageError;

        const { data: urlData } = supabaseClient.storage
          .from('pdfs')
          .getPublicUrl(safeFileName);

        const publicUrl = urlData.publicUrl;

        const { error: dbError } = await supabaseClient
          .from('pdf_list')
          .insert([{ 
            file_name: displayTitle, 
            file_url: publicUrl,
            thumbnail_url: thumbnailUrl,
            password: filePassword !== '' ? filePassword : null
          }]);

        if (dbError) throw dbError;

        updateStatus('success', 'アップロード成功');
        
        fileInput.value = '';
        customTitleInput.value = '';
        filePasswordInput.value = '';
        selectedFileName.classList.add('hidden');
        formFieldsContainer.classList.add('hidden');
        generatedThumbnailCanvas = null;
        
        loadPdfs();
        switchPage('library');

      } catch (err) {
        updateStatus('error', `エラー: ${err.message}`);
        uploadBtn.disabled = false;
      }
    }

    function extractStoragePath(url) {
      try {
        const parts = url.split('/storage/v1/object/public/pdfs/');
        return parts.length > 1 ? decodeURIComponent(parts[1]) : null;
      } catch (e) {
        return null;
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
